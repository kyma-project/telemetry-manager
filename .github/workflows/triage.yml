name: Triage

on:
  issues:
    types: [opened]

jobs:
  label-new-issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    permissions:
      issues: write
    steps:
      - name: Add needs-triage label
        run: |
          gh issue edit "${{ github.event.issue.number }}" --repo "$GH_REPO" --add-label "needs-triage"
